<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <style>
      .t{fill:#e6edf3}.m{fill:#8b949e}
      .fade{animation:in 1s ease both}
      .d1{animation-delay:.2s}.d2{animation-delay:.6s}.d3{animation-delay:1s}.d4{animation-delay:1.4s}
      @keyframes in{from{opacity:0}to{opacity:1}}
      .float{animation:fl 4s ease-in-out infinite}
      .float2{animation:fl 5s ease-in-out infinite .8s}
      .float3{animation:fl 4.5s ease-in-out infinite 1.6s}
      @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
      .line{stroke-dasharray:220;animation:type 3s ease infinite}
      .l2{animation-delay:.4s}.l3{animation-delay:.8s}.l4{animation-delay:1.2s}
      @keyframes type{0%{stroke-dashoffset:220}40%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
      .pulse{animation:pu 2s ease-in-out infinite}
      @keyframes pu{0%,100%{opacity:1}50%{opacity:.3}}
    </style>
  </defs>
  <rect width="1200" height="400" rx="18" fill="url(#bg)"/>
  <!-- Text -->
  <text x="70" y="120" class="m fade d1" font-size="20">Hi, I'm</text>
  <text x="70" y="185" class="t fade d2" font-size="60" font-weight="700">YOUR_NAME</text>
  <text x="70" y="235" fill="url(#accent)" class="fade d3" font-size="28" font-weight="600">YOUR_TITLE</text>
  <g class="fade d4">
    <circle cx="80" cy="290" r="7" fill="#3fb950" class="pulse"/>
    <text x="96" y="297" class="m" font-size="18">Based in YOUR_LOCATION · Open to freelance &amp; remote work</text>
  </g>
  <!-- Code window -->
  <g class="float">
    <rect x="640" y="60" width="300" height="190" rx="12" fill="#161b22" stroke="#30363d"/>
    <circle cx="662" cy="80" r="5" fill="#ff5f56"/><circle cx="680" cy="80" r="5" fill="#ffbd2e"/><circle cx="698" cy="80" r="5" fill="#27c93f"/>
    <g stroke-width="8" stroke-linecap="round">
      <line x1="665" y1="120" x2="885" y2="120" stroke="#a371f7" class="line"/>
      <line x1="685" y1="150" x2="905" y2="150" stroke="#58a6ff" class="line l2"/>
      <line x1="685" y1="180" x2="845" y2="180" stroke="#3fb950" class="line l3"/>
      <line x1="665" y1="210" x2="805" y2="210" stroke="#d29922" class="line l4"/>
    </g>
  </g>
  <!-- UI card -->
  <g class="float2">
    <rect x="900" y="200" width="230" height="150" rx="12" fill="#161b22" stroke="#30363d"/>
    <rect x="920" y="220" width="90" height="12" rx="6" fill="#30363d"/>
    <rect x="920" y="250" width="190" height="50" rx="8" fill="url(#accent)" opacity=".85"/>
    <rect x="920" y="315" width="80" height="20" rx="10" fill="#238636"/>
    <rect x="1010" y="315" width="80" height="20" rx="10" fill="#30363d"/>
  </g>
  <!-- Database -->
  <g class="float3" transform="translate(0,0)">
    <g transform="translate(700,280)">
      <ellipse cx="60" cy="0" rx="60" ry="16" fill="#1f6feb"/>
      <path d="M0 0v60c0 9 27 16 60 16s60-7 60-16V0c0 9-27 16-60 16S0 9 0 0z" fill="#1158c7"/>
      <path d="M0 30c0 9 27 16 60 16s60-7 60-16" fill="none" stroke="#58a6ff" stroke-width="2"/>
    </g>
  </g>
</svg>
