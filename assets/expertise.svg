<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="a" x1="0" x2="1"><stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#a371f7"/></linearGradient>
    <style>.c{animation:in .8s ease both}.c2{animation-delay:.3s}.c3{animation-delay:.6s}@keyframes in{from{opacity:0}to{opacity:1}}</style>
  </defs>
  <rect width="1200" height="220" rx="18" fill="#0d1117"/>
  <g class="c"><rect x="40" y="40" width="350" height="140" rx="14" fill="#161b22" stroke="#30363d"/>
    <rect x="40" y="40" width="350" height="5" rx="2" fill="url(#a)"/>
    <text x="70" y="95" fill="#e6edf3" font-size="24" font-weight="700">Full-Stack Apps</text>
    <text x="70" y="130" fill="#8b949e" font-size="17">SKILL_1 · SKILL_2 · SKILL_3</text></g>
  <g class="c c2"><rect x="425" y="40" width="350" height="140" rx="14" fill="#161b22" stroke="#30363d"/>
    <rect x="425" y="40" width="350" height="5" rx="2" fill="url(#a)"/>
    <text x="455" y="95" fill="#e6edf3" font-size="24" font-weight="700">APIs &amp; Data</text>
    <text x="455" y="130" fill="#8b949e" font-size="17">REST · Databases · Queues · Cache</text></g>
  <g class="c c3"><rect x="810" y="40" width="350" height="140" rx="14" fill="#161b22" stroke="#30363d"/>
    <rect x="810" y="40" width="350" height="5" rx="2" fill="url(#a)"/>
    <text x="840" y="95" fill="#e6edf3" font-size="24" font-weight="700">Testing</text>
    <text x="840" y="130" fill="#8b949e" font-size="17">TDD · Unit · Feature tests</text></g>
</svg>
